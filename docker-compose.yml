services:
  postgres:
    image: postgres:16
    container_name: trabalhae-postgres
    environment:
      POSTGRES_DB: trabalhae
      POSTGRES_USER: trabalhae
      POSTGRES_PASSWORD: trabalhae
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./backend/scripts/criar-banco-de-teste.sql:/docker-entrypoint-initdb.d/criar-banco-de-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trabalhae -d trabalhae"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
